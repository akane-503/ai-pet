<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; media-src 'self' file:; script-src 'self'">
<link rel="stylesheet" href="pet.css">
</head>

      <img id="gif" class="gif" alt="">
      <div id="text" class="text"><div id="l1" class="label"></div><div id="l2" class="amount"></div><div id="l3" class="hint"></div></div>
    </div>
  </div>
  <button id="menu-btn" class="menu-btn" title="菜单"><span></span><span></span><span></span></button>
</div>
<audio id="snd-press" preload="auto"></audio>
<audio id="snd-release" preload="auto"></audio>
<script src="../shared/geometry.js"></script>
<script src="pet.js"></script>

</html>
