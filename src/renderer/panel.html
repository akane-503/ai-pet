<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<style>
:root { --line: #203170; --text: #536ba9; --hint: #9fb0d9; --soft: color-mix(in srgb, var(--hint) 22%, white); }
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; background: transparent; font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif; font-size: 12px; color: var(--line); overflow: hidden; }
.panel { position: absolute; left: 6px; right: 6px; top: 6px; max-height: calc(100vh - 12px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--hint) transparent; background: rgba(255,255,255,.97); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.18); animation: pop .2s cubic-bezier(.34,1.56,.64,1); }
@keyframes pop { from { transform: scale(.94) translateY(-4px); opacity: 0 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
.info { display: grid; gap: 2px; margin: 0 -4px 8px; padding: 6px 8px; border-radius: 8px; background: var(--soft); }
.why { font-size: 11px; color: var(--text); margin: 0 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
.info .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin: 2px 0; }
.info .k { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .info .v { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.info .v.err { color: #d93d3a; font-weight: 500; } .info .v.stale { color: var(--hint); }
.row { display: flex; align-items: center; gap: 8px; margin: 6px 0; white-space: nowrap; }
.row label { width: 30px; color: var(--text); }
.row input[type=range] { flex: 1; min-width: 0; accent-color: var(--line); }
.row select { flex: 1; height: 26px; border: 1px solid color-mix(in srgb, var(--hint) 70%, white); border-radius: 6px; padding: 0 4px; font: inherit; color: var(--line); background: #fff; }
.row .val { width: 36px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
input[type=checkbox] { accent-color: var(--line); margin: 0; }
.toggles { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 4px; margin: 8px 0 2px; }
.toggles label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
/* 「打开 xxx」单独占一行：工具名常带版本/环境后缀，和别人挤一行会被截成「打开 Cursor…」 */
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.btns button { flex: 1; min-width: 0; height: 28px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; border: 1px solid color-mix(in srgb, var(--hint) 70%, white); border-radius: 7px; background: #fff; color: var(--line); font: inherit; cursor: pointer; transition: background .15s, color .15s; }
.btns button:hover { background: var(--soft); }
.btns button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
.btns #launch-btn { flex: 1 0 100%; background: var(--line); border-color: var(--line); color: #fff; font-weight: 700; }
.btns #launch-btn:hover { background: color-mix(in srgb, var(--line) 85%, black); }
.btns button.quit { color: #d93d3a; flex: 0 0 auto; border-color: transparent; }
.btns button.quit:hover { background: #fdecec; }
</style></head>
<body><div class="panel">
  <div id="info" class="info"></div>
  <div id="why" class="why"></div>
  <div class="row"><label>角色</label><select data-cfg="character"></select></div>
  <div class="row"><label>大小</label><input type="range" min="0.5" max="2.4" step="0.05" data-cfg="scale"><span class="val" id="scale-val"></span></div>
  <div class="row"><label>音效</label><select data-cfg="sound"><option value="off">关</option><option value="duck">小黄鸭</option><option value="fx1">音效1</option></select><input type="range" min="0" max="1" step="0.05" data-cfg="volume" style="width:60px"></div>
  <div class="row"><label>峰谷</label><select data-cfg="peakMode"><option value="default">默认</option><option value="liang">梁文峰谷</option><option value="strong">!?强强?!</option><option value="off">关闭</option></select></div>
  <div class="toggles">
    <label><input type="checkbox" data-cfg="bubbleOn"> 气泡</label>
    <label><input type="checkbox" data-cfg="quipsOn"> 台词</label>
    <label><input type="checkbox" data-cfg="snapWindows"> 吸附窗口</label>
    <label><input type="checkbox" data-cfg="alwaysOnTop"> 置顶</label>
  </div>
  <div class="btns"><button data-act="launch" id="launch-btn">打开工具</button><button data-act="refresh">刷新</button><button data-act="settings">设置</button><button data-act="quit" class="quit">退出</button></div>
</div>
<script src="../shared/usage.js"></script>
<script src="panel.js"></script></body></html>
