<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<style>
:root { --line: #203170; --text: #536ba9; --hint: #9fb0d9; --soft: color-mix(in srgb, var(--hint) 22%, white); }
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; background: transparent; font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif; font-size: 12px; color: var(--line); overflow: hidden; }
.panel { position: absolute; left: 6px; right: 6px; top: 6px; max-height: calc(100vh - 12px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--hint) transparent; background: rgba(255,255,255,.97); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.18); animation: pop .2s cubic-bezier(.34,1.56,.64,1); }
@keyframes pop { from { transform: scale(.94) translateY(-4px); opacity: 0 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
.info { display: grid; gap: 2px; margin: 0 -4px 8px; padding: 6px 8px; border-radius: 8px; background: var(--soft); overflow: hidden; }
.why { font-size: 11px; color: var(--text); margin: 0 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
.info .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin: 2px 0; min-width: 0; }
.info .k { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info .v { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 0; display: flex; align-items: baseline; gap: 4px; }
/* 数值列里带的提示（剩 N / 重置倒计时）先收缩截断，主数值保持完整 */
.info .v .k { flex: 0 1 auto; min-width: 0; }
.info .v.err { color: #d93d3a; font-weight: 500; display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; } .info .v.stale { color: var(--hint); }
.info .v.err { color: #d93d3a; font-weight: 500; } .info .v.stale { color: var(--hint); }
.info .row.claim { cursor: pointer; padding: 3px 6px; margin: 2px -6px; border-radius: 6px; background: color-mix(in srgb, #e8a13d 16%, white); }
.info .row.claim:hover { background: color-mix(in srgb, #e8a13d 28%, white); }
.info .row.claim .v { color: #b06f10; }
.row { display: flex; align-items: center; gap: 8px; margin: 6px 0; white-space: nowrap; }
.row label { width: 30px; color: var(--text); }
.row input[type=range] { flex: 1; min-width: 0; accent-color: var(--line); }
.row select { flex: 1; height: 26px; border: 1px solid color-mix(in srgb, var(--hint) 70%, white); border-radius: 6px; padding: 0 4px; font: inherit; color: var(--line); background: #fff; }
.row .val { width: 36px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
input[type=checkbox] { accent-color: var(--line); margin: 0; }
.toggles { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 4px; margin: 8px 0 2px; }
.toggles label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
/* 「打开 xxx」单独占一行：工具名常带版本/环境后缀，和别人挤一行会被截成「打开 Cursor…」 */
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.btns button { flex: 1; min-width: 0; height: 28px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; border: 1px solid color-mix(in srgb, var(--hint) 70%, white); border-radius: 7px; background: #fff; color: var(--line); font: inherit; cursor: pointer; transition: background .15s, color .15s; }
.btns button:hover { background: var(--soft); }
.btns button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
.btns #launch-btn { flex: 1 0 100%; background: var(--line); border-color: var(--line); color: #fff; font-weight: 700; }
.btns #transfer-btn { flex: 1 0 100%; }
.btns #launch-btn:hover { background: color-mix(in srgb, var(--line) 85%, black); }
.btns button.quit { color: #d93d3a; flex: 0 0 auto; border-color: transparent; }
.btns button.quit:hover { background: #fdecec; }
.project-view { margin-top: 10px; border-top: 1px solid color-mix(in srgb, var(--hint) 60%, white); padding-top: 8px; }
.project-view summary { cursor: pointer; font-weight: 700; }
.project-view form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; margin-top: 8px; }
.project-view form label { grid-column: 1 / -1; color: var(--text); }
.project-view input, .project-view button { min-width: 0; border: 1px solid var(--hint); border-radius: 6px; padding: 4px 6px; font: inherit; background: white; color: var(--line); }
.project-view input { user-select: text; }
.project-view button:not(:disabled) { cursor: pointer; }
.project-view button:hover:not(:disabled) { background: var(--soft); }
.project-view input:focus-visible, .project-view button:focus-visible, .project-view summary:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
.project-view p { margin: 6px 0; overflow-wrap: anywhere; }
.project-view h2 { font-size: inherit; margin: 8px 0 3px; }
.project-view ul { margin: 0; padding-left: 16px; }
.project-view li { margin: 3px 0; overflow-wrap: anywhere; }
.project-view li button { margin-left: 4px; padding: 1px 4px; font-size: 10px; }
.project-task-tree { padding-left: 0 !important; list-style: none; }
.project-task-tree ul { padding-left: 10px; border-left: 1px solid var(--soft); list-style: none; }
.project-task-tree summary { font-weight: 500; overflow-wrap: anywhere; }
.project-task-tree .task-meta { font-size: 11px; color: var(--text); user-select: text; }
#project-message { color: var(--text); }
#project-source { white-space: pre-line; color: var(--text); user-select: text; }
#project-results { max-height: 190px; overflow-y: auto; scrollbar-width: thin; }
.pm-viewtabs { display: flex; gap: 6px; align-items: center; margin: 6px 0 2px; }
.pm-viewtabs button { font-size: 11px; line-height: 1.6; padding: 1px 10px; border-radius: 99px; border: 1px solid var(--soft); background: transparent; color: var(--text); cursor: pointer; }
.pm-viewtabs button.on { background: var(--line); color: #fff; border-color: var(--line); }
.pm-map { padding-left: 0 !important; list-style: none; }
.pm-map ul { padding-left: 12px; border-left: 1px solid var(--soft); list-style: none; margin: 0; }
.pm-map li { margin: 5px 0; }
.pm-map summary { cursor: pointer; }
.pm-map summary::marker { color: var(--hint); }
.pm-node-row { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; overflow-wrap: anywhere; }
.pm-node-row b { color: var(--line); }
.pm-chip { font-size: 10.5px; line-height: 1.6; border-radius: 99px; padding: 0 7px; background: color-mix(in srgb, var(--hint) 14%, white); color: var(--text); white-space: nowrap; }
.pm-chip.role { background: color-mix(in srgb, var(--line) 16%, white); color: var(--line); }
.pm-chip.ok { background: color-mix(in srgb, #1f8a4c 13%, white); color: #1f8a4c; }
.pm-chip.st-working { background: color-mix(in srgb, var(--line) 14%, white); color: var(--line); }
.pm-chip.st-ready { background: #f5e8c8; color: #8a6410; }
.pm-chip.st-done { background: color-mix(in srgb, #1f8a4c 13%, white); color: #1f8a4c; }
.pm-chip.st-blocked { background: color-mix(in srgb, #c0392b 12%, white); color: #c0392b; }
.pm-map .task-meta { font-size: 11px; color: var(--text); user-select: text; margin: 4px 0 0; padding-left: 4px; }
.pm-map .task-meta p { margin: 2px 0; }
.pm-map .task-meta p.sub { padding-left: 10px; }
/* 拉开模式：打开项目进度时折叠上方额度/设置区，画布占满整个气泡 */
.panel.pm-focus #info, .panel.pm-focus #why, .panel.pm-focus .row, .panel.pm-focus .toggles, .panel.pm-focus .btns { display: none; }
.panel.pm-focus #project-results { max-height: none; }
.panel.pm-focus #project-view { margin-top: 0; border-top: 0; padding-top: 0; }
/* 架构图 v2：面向用户的节点卡片 + 丝滑动画 */
#project-results { interpolate-size: allow-keywords; }
.pm-map-wrap { display: flex; flex-direction: column; gap: 8px; }
.pm-root-card { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; background: var(--line); color: #fff; border-radius: 10px; padding: 8px 12px; font-weight: 700; }
.pm-root-card b { color: #fff; margin-right: 2px; }
.pm-root-card .pm-chip { background: #ffffff2e; color: #fff; }
.pm-progress { flex: 1 0 60px; height: 6px; border-radius: 99px; background: #ffffff3d; overflow: hidden; }
.pm-progress i { display: block; height: 100%; border-radius: 99px; background: #7ddb9a; transition: width .5s cubic-bezier(.22, 1, .36, 1); }
.pm-map li { --i: 0; animation: pmIn .32s cubic-bezier(.22, 1, .36, 1) both; animation-delay: calc(var(--i) * 45ms); }
@keyframes pmIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.pm-ag { border-radius: 9px; border: 1px solid var(--soft); background: white; padding: 6px 10px; margin: 0; }
.pm-ag.st-working { border-color: color-mix(in srgb, var(--line) 55%, white); }
.pm-ag.st-blocked { border-color: color-mix(in srgb, #c0392b 45%, white); }
.pm-ag.st-done { opacity: .82; }
.pm-ag summary { list-style: none; display: flex; cursor: pointer; }
.pm-ag summary::-webkit-details-marker { display: none; }
.pm-node-row { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; overflow-wrap: anywhere; flex: 1; }
.pm-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--hint); flex: none; margin-right: 2px; }
.pm-dot.pulse { background: var(--line); animation: pmPulse 1.6s ease-in-out infinite; }
.pm-dot.alert { background: #c0392b; }
@keyframes pmPulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--line) 45%, transparent); } 50%, 99% { box-shadow: 0 0 0 5px transparent; } }
.pm-brief { margin: 5px 0 2px; padding-left: 13px; font-size: 11.5px; color: var(--text); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; user-select: text; }
.pm-brief.alert { color: #c0392b; }
.pm-ag .task-meta { margin-top: 6px; border-top: 1px dashed var(--soft); padding-top: 5px; }
/* details 展开丝滑（Chromium 129+ 的 ::details-content，旧内核静默降级） */
.pm-ag::details-content { block-size: 0; overflow: hidden; transition: block-size .3s cubic-bezier(.22, 1, .36, 1), content-visibility .3s allow-discrete; }
.pm-ag[open]::details-content { block-size: auto; }
@media (prefers-reduced-motion: reduce) { .pm-map li { animation: none; } .pm-dot.pulse { animation: none; } .pm-ag::details-content { transition: none; } }
</style></head>
<body><div class="panel">
  <div id="info" class="info"></div>
  <div id="why" class="why"></div>
  <div class="row"><label>角色</label><select data-cfg="character"></select></div>
  <div class="row"><label>大小</label><input type="range" min="0.5" max="2.4" step="0.05" data-cfg="scale"><span class="val" id="scale-val"></span></div>
  <div class="row"><label>音效</label><select data-cfg="sound"><option value="off">关</option><option value="duck">小黄鸭</option><option value="fx1">音效1</option></select><input type="range" min="0" max="1" step="0.05" data-cfg="volume" style="width:60px"></div>
  <div class="row"><label>峰谷</label><select data-cfg="peakMode"><option value="default">默认</option><option value="liang">梁文峰谷</option><option value="strong">!?强强?!</option><option value="off">关闭</option></select></div>
  <div class="toggles">
    <label><input type="checkbox" data-cfg="bubbleOn"> 气泡</label>
    <label><input type="checkbox" data-cfg="quipsOn"> 台词</label>
    <label><input type="checkbox" data-cfg="snapWindows"> 吸附窗口</label>
    <label><input type="checkbox" data-cfg="alwaysOnTop"> 置顶</label>
  </div>
  <div class="btns"><button data-act="launch" id="launch-btn">打开工具</button>
  <button id="transfer-btn" data-act="transfer">转接到其他工具</button><button data-act="refresh">刷新</button><button data-act="settings">设置</button><button data-act="quit" class="quit">退出</button></div>
  <details id="project-view" class="project-view" hidden>
    <summary>项目进度</summary>
    <form id="project-form">
      <label for="project-root">项目目录</label>
      <input id="project-root" type="text" autocomplete="off" spellcheck="false" placeholder="自动识别，或输入项目目录" required>
      <button id="project-refresh" type="submit">读取</button>
    </form>
    <p id="project-source">展开后自动识别当前项目。</p>
    <p id="project-message" role="status">输入包含 .team 的项目目录。</p>
    <div id="project-results"></div>
  </details>
</div>
<script src="../shared/usage.js"></script>
<script src="panel.js"></script></body></html>
