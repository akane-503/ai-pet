<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>AI 桌宠 · Agent 架构</title>
<style>
:root {
  --line: #203170; --text: #536ba9; --hint: #7b8cb3;
  --ink: color-mix(in srgb, var(--line) 65%, #18202c);
  --muted: color-mix(in srgb, var(--line) 40%, #5a626c);
  --ok: #1f8a4c; --err: #c0392b;
  --page: #f2f5fa; --surface: white; --border: color-mix(in srgb, var(--hint) 34%, white);
}
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; display: flex; flex-direction: column; font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif; font-size: 13px; line-height: 1.5; color: var(--ink); background: var(--page); }
header { display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex: none; }
header b { font-size: 15px; letter-spacing: .5px; color: var(--line); white-space: nowrap; }
#map-root { flex: 1; min-width: 140px; height: 34px; border: 1px solid var(--border); border-radius: 8px; padding: 0 12px; font: inherit; color: var(--ink); background: white; transition: border-color .15s, box-shadow .15s; }
#map-root:focus { outline: none; border-color: var(--text); box-shadow: 0 0 0 3px color-mix(in srgb, var(--text) 16%, transparent); }
button { height: 34px; border: 1px solid var(--border); background: white; color: var(--ink); border-radius: 8px; padding: 0 14px; cursor: pointer; font: inherit; white-space: nowrap; transition: background .15s; }
button:hover { background: color-mix(in srgb, var(--hint) 12%, white); border-color: var(--hint); }
button:active { transform: translateY(1px); }
.meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
main { flex: 1; min-height: 0; display: flex; padding: 14px 16px 12px; }
.hint { color: var(--muted); margin: 0; }
#map-view { flex: 1; min-width: 0; }
#map-view > .hint { margin: auto; text-align: center; }
.mm-wrap { display: flex; flex-direction: column; gap: 8px; height: 100%; }
.mm-graph { position: relative; flex: 1; min-height: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: auto; }
.mm-graph svg { position: absolute; top: 0; left: 0; pointer-events: none; }
.mm-graph svg path { fill: none; stroke: color-mix(in srgb, var(--text) 34%, white); stroke-width: 2.5; }
.mm-node { position: absolute; width: 280px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; box-shadow: 0 2px 6px color-mix(in srgb, var(--line) 10%, transparent); cursor: default; }
.mm-node.root { border-color: var(--line); background: var(--line); }
.mm-node.root .mm-title { color: #fff; }
.mm-node.root .mm-chip { background: #ffffff2e; color: #fff; }
.mm-title { margin: 0; font-weight: 700; font-size: 14px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mm-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.mm-chip { font-size: 11px; line-height: 1.7; border-radius: 99px; padding: 0 8px; background: color-mix(in srgb, var(--hint) 14%, white); color: var(--muted); white-space: nowrap; }
.mm-chip.role { background: color-mix(in srgb, var(--text) 12%, white); color: var(--text); }
.mm-chip.ok { background: color-mix(in srgb, var(--ok) 13%, white); color: var(--ok); }
.mm-chip.st-working { background: color-mix(in srgb, var(--text) 14%, white); color: var(--text); }
.mm-chip.st-ready { background: #f5e8c8; color: #8a6410; }
.mm-chip.st-done { background: color-mix(in srgb, var(--ok) 13%, white); color: var(--ok); }
.mm-chip.st-blocked { background: color-mix(in srgb, var(--err) 12%, white); color: var(--err); }
.mm-node .mm-task { font-family: Consolas, "Cascadia Mono", monospace; }
.mm-detail { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 7px; font-size: 11.5px; color: var(--muted); user-select: text; }
.mm-detail p { margin: 3px 0; overflow-wrap: anywhere; }
.mm-detail p.mm-sub { padding-left: 10px; color: color-mix(in srgb, var(--muted) 78%, white); }
.mm-legend { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 11px; }
.mm-legend .mm-chip { cursor: default; }
</style>
</head>
<body>
<header>
  <b>Agent 架构</b>
  <input id="map-root" type="text" placeholder="项目目录的完整路径">
  <button id="map-detect">自动识别当前项目</button>
  <button id="map-read">读取</button>
  <span id="map-meta" class="meta"></span>
</header>
<main>
  <div id="map-view"><p class="hint">填项目目录后读取，或点「自动识别当前项目」。<br>决策者 → 工作线 → 执行，点节点展开该 agent 的任务、工作树、租约和最近报告。<br>与快捷面板共用最近使用的项目。只读，数据不出本机。</p></div>
</main>
<script src="agentmap.js"></script>
</body>
</html>
