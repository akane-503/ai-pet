<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'"><title>AI 桌宠：工具转接</title><link rel="stylesheet" href="transfer.css"></head>
<body><div class="menu">
<header><button id="back" hidden aria-label="返回工具列表">‹</button><h1 id="heading">转接工具</h1><button id="close" aria-label="关闭">×</button></header>
<main>
<p id="intro" hidden></p>
<div class="source"><div><span class="caption">来源</span><strong id="source-name">正在读取…</strong><span id="source-project"></span></div><button id="change-source">更换</button></div>
<div id="workspace" class="workspace" title="">工作区：自动定位中…</div>
<p id="status" role="status"></p>
<section id="targets"><input id="search" type="search" placeholder="搜索工具" aria-label="搜索目标工具"><div id="target-list" class="choices"></div></section>
<section id="sessions" hidden><input id="session-search" type="search" placeholder="搜索会话（标题 / 项目）" aria-label="搜索来源会话"><div id="session-list" class="choices"></div><button id="auto-source" class="menu-action">使用自动识别的会话</button></section>
<section id="modes" hidden>
<button id="start-direct" class="menu-action primary">直接接手<span>读取记录，自动定位工作区</span></button>
<details id="more"><summary>更多方式</summary><div class="alternative"><button id="start-summary" class="menu-action">DS 总结后接手<span>使用 API，会发送会话材料</span></button><p id="summary-reason"></p></div><button id="start-file" class="menu-action" hidden>接手已有交接文件</button></details>
</section>
</main></div>
<script src="../shared/transfer-flow.js"></script><script src="transfer.js"></script>
</body></html>
